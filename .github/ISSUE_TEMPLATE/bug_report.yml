name: Bug 报告
description: 报告可复现的异常、回归或错误行为
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。AnoClaw 是公开仓库，请先移除密钥、用户数据、私有提示词、绝对路径和敏感日志。
  - type: input
    id: summary
    attributes:
      label: 问题摘要
      description: 用一句话描述实际错误行为。
      placeholder: 例如：重启后会话列表丢失最近一条记录
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - P0 - 数据破坏或产品完全不可用
        - P1 - 核心路径阻断且无可靠绕过
        - P2 - 重要功能异常但存在绕过
        - P3 - 轻微问题或体验缺陷
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 填写 AnoClaw 版本或提交、Windows 版本、安装版或源码运行方式及相关插件。请使用脱敏路径。
      placeholder: |
        AnoClaw: v2.x.x / commit SHA
        Windows: 11 24H2
        运行方式: 安装版 / 源码
        相关插件: ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 执行 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附最小日志、截图或视频。禁止粘贴 token、配置、完整会话或用户数据。
  - type: textarea
    id: regression
    attributes:
      label: 回归与范围
      description: 若知道，请填写最后正常版本、首次异常版本、频率和可用绕过。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现同一问题。
          required: true
        - label: 我已移除密钥、私人数据和敏感日志。
          required: true
        - label: 这不是安全漏洞；安全问题应通过 GitHub Security 私密报告。
          required: true

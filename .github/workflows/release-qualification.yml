name: Windows Release Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Stop stale desktop processes
        shell: pwsh
        run: Get-Process AnoClaw,electron -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Enforce module boundary baseline
        run: npm run check:boundaries

      - name: Run tests
        run: npm test

      - name: Build all layers
        run: npm run build:all

      - name: Package installer and portable build
        run: npm run package:win

      - name: Inspect release artifacts
        run: npm run release:verify

      - name: Exercise silently installed app
        env:
          CI: "true"
        run: npm run test:e2e:installed

      - name: Reinspect release artifacts after E2E
        run: npm run release:verify

      - name: Stop desktop processes after qualification
        if: always()
        shell: pwsh
        run: Get-Process AnoClaw,electron -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload candidate release and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anoclaw-windows-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release9/*.exe
            release9/*.zip
            release9/release-manifest.json
            release9/SHA256SUMS.txt
            .artifacts/release-qualification/**

name: 功能建议
description: 提议新的用户能力或对现有流程的改进
title: "feat: "
body:
  - type: input
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户目前无法完成或成本过高的事情，不要只写功能名称。
      placeholder: 当……时，用户需要……，但目前……
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收标准
      description: 用可观察、可测试的结果描述成功状态。
      placeholder: |
        - [ ] 用户可以 ...
        - [ ] 失败时系统会 ...
        - [ ] 不影响 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可描述交互、API、插件边界或数据流；方案不是最终承诺。
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括当前绕过、插件实现可能性及不实现的影响。
  - type: textarea
    id: scope
    attributes:
      label: 范围与影响
      description: 写明范围内、范围外、兼容性、迁移、权限、性能和发布影响。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 PR，未发现同一建议。
          required: true
        - label: 我说明的是用户或工程问题，而不只是指定实现。
          required: true
        - label: 内容不包含密钥、用户数据或其他私人信息。
          required: true
